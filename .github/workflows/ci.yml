name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libblkid-dev libcrypt-dev shellcheck
      - run: make CFLAGS="-O2 -g -Werror"
      - run: make check
      - run: shellcheck tests/cli.sh
      - run: make install DESTDIR="$PWD/dest" && find dest | sort
